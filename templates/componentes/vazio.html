{# Estado vazio de uma lista. Parâmetros: titulo, texto e, opcional, icone. #}
<div class="flex flex-col items-center px-4 py-8 text-center">
  <i data-lucide="{{ icone|default:'inbox' }}" class="size-8 text-slate-400"></i>
  <p class="mt-3 text-sm font-semibold">{{ titulo }}</p>
  {% if texto %}<p class="mt-1 max-w-sm text-sm text-slate-500">{{ texto }}</p>{% endif %}
</div>
