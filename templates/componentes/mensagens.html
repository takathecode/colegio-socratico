{# Mensagens de sucesso e de erro enviadas pelas views com django.contrib.messages. #}
{% if messages %}
  <div class="mb-4 space-y-2">
    {% for mensagem in messages %}
      <p role="status" class="rounded-lg border px-4 py-3 text-sm
        {% if mensagem.tags == 'success' %}border-green-200 bg-green-50 text-green-800
        {% elif mensagem.tags == 'error' %}border-red-200 bg-red-50 text-red-800
        {% elif mensagem.tags == 'warning' %}border-amber-200 bg-amber-50 text-amber-800
        {% else %}border-[#E5E9F0] bg-white text-[#0B2545]{% endif %}">{{ mensagem }}</p>
    {% endfor %}
  </div>
{% endif %}
