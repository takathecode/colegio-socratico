{# Card de indicador. Parâmetros: rotulo, valor, detalhe, icone. #}
<div class="rounded-xl border border-[#E5E9F0] bg-white p-4">
  <div class="flex items-start justify-between gap-2">
    <p class="text-xs text-slate-500">{{ rotulo }}</p>
    <i data-lucide="{{ icone }}" class="size-4 shrink-0 text-[#1F4E8C]"></i>
  </div>
  <p class="mt-1 text-2xl font-semibold">{{ valor }}</p>
  <p class="mt-1 truncate text-xs text-slate-500" title="{{ detalhe }}">{{ detalhe }}</p>
</div>
