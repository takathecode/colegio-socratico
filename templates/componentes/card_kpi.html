{# Card de indicador. Parâmetros: rotulo, valor, detalhe, icone e, opcional, classe (ex.: "sm:col-span-2"). #}
{# Valor composto ("12/40", "2 de 5") vem pronto da view, porque o include não junta textos. #}
<div class="cartao p-4 {{ classe|default:'' }}">
  <div class="flex items-start justify-between gap-2">
    <p class="text-xs text-slate-500">{{ rotulo }}</p>
    <i data-lucide="{{ icone }}" class="size-4 shrink-0 text-primaria"></i>
  </div>
  <p class="mt-1 text-2xl font-semibold">{{ valor }}</p>
  <p class="mt-1 truncate text-xs text-slate-500" title="{{ detalhe }}">{{ detalhe }}</p>
</div>
