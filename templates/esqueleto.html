{% load static %}<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Portal Acadêmico{% endblock %} · Instituto Socrático</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block classes_body %}min-h-screen bg-[#F5F7FA] text-[#0B2545] antialiased{% endblock %}">
  {% block corpo %}{% endblock %}
  <script src="https://unpkg.com/lucide@1.67.0/dist/umd/lucide.min.js"></script>
  <script src="{% static 'js/portal.js' %}"></script>
</body>
</html>
