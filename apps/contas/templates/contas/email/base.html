<!doctype html>
<html lang="pt-br">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block titulo %}{% endblock %}</title></head>
{# E-mail em HTML: estilos dentro das tags, porque muitos programas de e-mail ignoram <style>. #}
<body style="margin:0;padding:0;background:#F5F7FA;font-family:Inter,Arial,Helvetica,sans-serif;color:#0B2545;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F7FA;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#FFFFFF;border:1px solid #E5E9F0;border-radius:12px;">
        <tr><td style="background:#0B2545;border-radius:12px 12px 0 0;padding:20px 28px;">
          <span style="display:inline-block;width:32px;height:32px;line-height:32px;text-align:center;border-radius:8px;background:#FFFFFF;color:#0B2545;font-weight:700;font-size:18px;vertical-align:middle;">S</span>
          <span style="color:#FFFFFF;font-weight:700;font-size:16px;margin-left:10px;vertical-align:middle;">Instituto Socrático</span>
        </td></tr>
        <tr><td style="padding:28px;font-size:15px;line-height:1.6;">
          {% block conteudo %}{% endblock %}
        </td></tr>
        <tr><td style="padding:0 28px 24px;font-size:12px;line-height:1.5;color:#64748B;">
          Este é um e-mail automático do portal acadêmico do Instituto Socrático. Não responda esta mensagem.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
