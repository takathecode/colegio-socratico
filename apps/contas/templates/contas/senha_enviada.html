{% extends "contas/base_login.html" %}

{% block titulo %}Verifique seu e-mail{% endblock %}

{% block conteudo %}
  <h1 class="text-3xl font-semibold">Verifique seu e-mail</h1>
  <p class="mt-2 text-sm text-slate-500">
    Se o e-mail informado estiver cadastrado, você receberá um link para criar uma nova senha. O link vale por 1 hora.
  </p>
  <a href="{% url 'contas:entrar' %}" class="mt-6 inline-flex items-center gap-1 text-sm font-semibold text-[#1F4E8C] hover:underline">
    <i data-lucide="arrow-left" class="size-4"></i> Voltar para o login
  </a>
{% endblock %}
