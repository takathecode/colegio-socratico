{# Matrícula só para leitura (telas de senha). Sem "name": o valor nunca é enviado no formulário. #}
{# Borda tracejada, fundo cinza e cadeado: travado sem depender só da cor. O texto tem contraste AA. #}
<div>
  <label for="matricula-travada" class="text-sm font-medium">Matrícula</label>
  <div class="relative mt-2">
    <i data-lucide="user-round" class="pointer-events-none absolute left-4 top-1/2 size-5 -translate-y-1/2 text-slate-500"></i>
    <input id="matricula-travada" type="text" value="{{ matricula }}" readonly aria-readonly="true"
           autocomplete="username" aria-describedby="matricula-travada-ajuda"
           class="h-12 w-full cursor-not-allowed rounded-controle border border-dashed border-slate-400 bg-travado pl-12 pr-12 text-sm font-semibold text-marinho outline-none focus:ring-2 focus:ring-primaria/30">
    <i data-lucide="lock" class="pointer-events-none absolute right-4 top-1/2 size-4 -translate-y-1/2 text-slate-600"></i>
  </div>
  <p id="matricula-travada-ajuda" class="mt-1 text-xs text-slate-600">Somente leitura: a nova senha vale para esta matrícula.</p>
</div>
