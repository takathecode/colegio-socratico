{# Item de um dia na grade do calendário. Parâmetro: item. #}
<div title="{{ item.titulo }}{% if item.detalhe %} · {{ item.detalhe }}{% endif %}"
     class="mt-1 rounded-r border-l-2 px-1.5 py-1 text-[11px] leading-tight {% if item.destaque %}border-primaria bg-primaria-suave text-primaria{% else %}border-slate-400 bg-fundo text-slate-600{% endif %}">
  <p class="line-clamp-2">{{ item.titulo }}</p>
</div>
